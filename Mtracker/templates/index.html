<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产管家 · 极简版</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1>💰 资产管家</h1>
  <div class="topbar-actions">
    <button id="btn-rates" class="btn btn-sm">💱 汇率</button>
    <button id="toggle-hide" class="icon-btn" title="一键隐数">👁️</button>
  </div>
</header>

<main>
  <!-- 总资产卡片 -->
  <section class="card summary-card">
    <div class="summary-label">当前总资产</div>
    <div class="summary-amount amount">¥ --</div>
    <div class="summary-updated">最近更新：--</div>
  </section>

  <!-- 账户选择 + 列表 -->
  <section class="card">
    <div class="section-head">
      <h2>资产账户</h2>
      <button id="btn-new-account" class="btn btn-sm">＋ 新增账户</button>
    </div>
    <select id="account-select" class="select">
      <option value="">请先新增账户</option>
    </select>
    <ul id="account-list" class="account-list"></ul>
  </section>

  <!-- 记录资产区 -->
  <section class="card">
    <div class="section-head"><h2>记录资产</h2></div>
    <div id="drop-zone" class="drop-zone">
      <p>📷 拖拽 / 粘贴 / 点击选择截图</p>
      <p class="hint">识别账户：<span id="drop-account" class="accent">未选择</span></p>
      <input type="file" id="file-input" accept="image/*" hidden>
    </div>
    <button id="btn-manual" class="btn btn-manual">✏️ 手动输入金额</button>
  </section>

  <!-- 趋势图 -->
  <section class="card">
    <div class="section-head"><h2>资产走势</h2></div>
    <canvas id="trend-canvas" height="240"></canvas>
    <div id="trend-legend" class="legend"></div>
    <p id="trend-empty" class="hint">暂无记录</p>
  </section>
</main>

<!-- 识别确认弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modal-title">确认识别金额</h3>
    <label class="rec-label">保存到账户</label>
    <select id="modal-account-select" class="select"></select>
    <label class="rec-label" id="amount-label">推荐金额（可修改）</label>
    <input type="number" id="modal-amount" step="0.01" min="0" placeholder="输入金额">
    <div class="candidates-label" id="candidates-label">其他识别到的数字：</div>
    <div id="modal-candidates" class="candidates"></div>
    <p id="modal-error" class="error"></p>
    <div class="modal-actions">
      <button id="btn-cancel" class="btn">取消</button>
      <button id="btn-confirm" class="btn btn-primary">确认保存</button>
    </div>
  </div>
</div>

<!-- 新增账户弹窗 -->
<div id="account-modal" class="modal hidden">
  <div class="modal-box">
    <h3>新增账户</h3>
    <label class="rec-label">账户名称</label>
    <input type="text" id="account-name-input" placeholder="如：招商银行 / 支付宝">
    <label class="rec-label">币种</label>
    <select id="account-currency-select" class="select"></select>
    <p id="account-modal-error" class="error"></p>
    <div class="modal-actions">
      <button id="btn-account-cancel" class="btn">取消</button>
      <button id="btn-account-confirm" class="btn btn-primary">创建</button>
    </div>
  </div>
</div>

<!-- 汇率设置弹窗 -->
<div id="rates-modal" class="modal hidden">
  <div class="modal-box">
    <h3>汇率设置</h3>
    <p class="hint">1 单位外币 = 多少人民币（用于总资产和走势图换算）</p>
    <div id="rates-list"></div>
    <p id="rates-error" class="error"></p>
    <div class="modal-actions">
      <button id="btn-rates-close" class="btn btn-primary">完成</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
